<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内容区模板骨架 - 待按本系统设计稿搭建</title>
<style>
  /* ============================================================
   * 内容区模板骨架（_skeleton.html）
   * ------------------------------------------------------------
   * 这份文件**不是任何一类页面的模板**，只是「内容区模板要满足什么契约」的骨架。
   *
   * 页面结构——有哪些区块、什么顺序、怎么排布——必须照**本系统的设计稿或线上实测**来，
   * 不要照抄别的系统的模板。采集到的结构信号见 mine-tokens.js 报告第 1 节。
   *
   * ── 为什么不能照抄
   *    模板不只是结构，它还带着一整套取值阶梯（间距档 / 色板 / 圆角档）。
   *    抄过来之后，新系统的规范里会凭空多出几十个「待填」条目，
   *    而每一条看起来都像一个正经的规范项。
   *
   * ── 契约：生成器怎么用这份文件
   *    落位    scripts/templates/<类别>/<名字>.html，目录名即 --type 取值
   *    形态    完整的 HTML 文档；生成器提取 <style> / <body> 内层 / <script> 三部分
   *    :root   只写本模板用到的 Token（生成器会把内容区与多标签栏的 :root 合并进产物）
 *    文案    @@页面标题@@ → --name　　@@系统名@@ → --system
 *            生成器不认识任何具体系统的类名，只认这两个占位符
 *    替换点  需人工改的位置都标「业务替换点」
 *    演示区  只为让人看得见而造的块（触发按钮 / 假数据 / 说明文字），
 *            用 @transient 标记圈起来 + 根元素加 data-collect-ignore。两个都要打：
 *              @transient             → 注入宿主页时剔除（生成器按注释切段，不做 HTML 解析）
 *              data-collect-ignore    → 采集时整块跳过（否则 em 派生的 7px / 11.9px
 *                                       会被当成你的设计取值，还会压低网格覆盖率）
 *            写法见 README.md「演示区：两种标记，两个目的」。
   *
   * ── 取值
   *    本骨架刻意不引用任何 Token——结构还没搭，不该先编数值。
   *    搭的时候把用到的取值先登记进 foundation/tokens.md，再回灌这里的 :root。
   *
   * ── 必须自带基础重置（盒模型）
   *    每个内容区模板都要自己写一条 `* { box-sizing: border-box; }`。
   *
   *    为什么不能指望布局：内容区模板**可以被独立产出**——
   *    浮层类别（contract.json 的 overlay 里声明的）与 `--layout=none` 都不套布局外壳。
   *    那时若没有这条重置，部件按 content-box 算，带 height + padding 的会全部胀开。
   *    实测（2026-09-17，ZJPT 包）：弹窗标题栏 56 → 89、底栏 64 → 97、详情标签 22 → 24，
   *    **而校验器全程绿** —— E1 只管色值、E2 只比 :root 与 tokens.md，几何算错它看不出来。
   *    只有把独立产出的页在真实浏览器里量一遍才会暴露。
   *
   *    注入宿主页时这条不会被带走（浮层提取只保留选择器含 needles 的规则，`*` 不含任何 needle），
   *    所以写成全局 `*` 是安全的。
   *
   * ── 类名
   *    沿用本包的类名前缀（见包内 SKILL.md），不要另起一套。
   *    前缀是全库批量替换的锚点，另起一套会让后续替换漏掉这个文件。
   * ============================================================ */
  :root {
    /* 本模板用到的 Token 在这里登记（颜色 / 间距 / 圆角 / 阴影…），不要写死在选择器里 */
  }
</style>
</head>
<body>

<!-- ============================================================
     在这里搭本系统的内容区结构。

     搭之前先回答三个问题——答案在设计稿里，不在这个文件里：
       1. 这个页面由哪几个区块组成？顺序是什么？
       2. 每个区块的间距 / 圆角 / 色值分别是多少？（先登记进 foundation/tokens.md）
       3. 哪些位置是使用者必须替换的业务数据？

     搭完把第 3 点的每一处都标上「业务替换点」注释。

     不要从其它系统复制这一段。
     ============================================================ -->

</body>
</html>
