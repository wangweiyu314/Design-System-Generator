<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布局骨架 - 待按本系统设计稿搭建</title>
<style>
  /* ============================================================
   * 布局骨架（_skeleton.html）
   * ------------------------------------------------------------
   * 这份文件**不是一套布局**，只是「布局模板要满足什么契约」的骨架。
   *
   * 外壳长什么样——顶栏/侧栏有没有、在哪一侧、多宽多高、有没有面包屑和多标签——
   * 必须照**本系统的设计稿或线上实测**来搭，不要照抄别的系统的布局。
   * 采集到的外壳指纹见 mine-tokens.js 报告第 2 节「布局候选」。
   *
   * ── 契约：new-page.js 靠这三个注释找插入点
   *      <!-- @content-slot -->   必填，业务内容插入点
   *      <!-- @tabs-slot -->      选填，多标签栏插入点（--tabs 用）
   *      <!-- @page-title -->     选填，页面标题文本插入点（--name 用）
   *    三个标记都当作「文本占位符」用：谁包着它，就替换谁的内容。
   *    例如标题写成 <h1 class="你的前缀-page-header__title"><!-- @page-title --></h1>
   *
   *    ⚠ 上面这段示范写在 <style> 的 CSS 注释里，这是**刻意**的：
   *      new-page.js 换标记时只认「<style>/<script> 之外」的第一个出现。
   *      因为本文件——以及照抄它搭出来的每一套布局——都会在头部注释里示范标记写法，
   *      那些示范必须能被跳过。把示范写进正文的 HTML 注释里会怎样：
   *      内容被注进注释、真插入点原封不动留着，而所有校验项都是绿的
   *      （[E1]–[E5] 只看颜色与 Token）。只有把产物渲染出来量几何才会暴露。
   *
   * ── 取值
   *    本骨架刻意不引用任何 Token——外壳还没搭，不该先编数值。
   *    搭外壳时把用到的取值先登记进 foundation/tokens.md，再回灌这里的 :root。
   *
   * ── 类名
   *    沿用本包的类名前缀（见包内 SKILL.md），不要另起一套——
   *    前缀是全库批量替换的锚点，另起一套会让后续替换漏掉这个文件。
   *
   * ── 关于 data-page-node-id
   *    沉淀**本系统**的布局时，可以给元素加上 `data-page-node-id="<设计稿节点 id>"`
   *    作为「这块对应设计稿哪个节点」的锚点（check-tokens.js 会跳过含该属性的行，
   *    不把它们当作硬编码取值来查）。**但骨架不带** ——
   *    骨架不属于任何设计稿，带着别的系统的节点 id 只会让人以为它有意义。
   * ============================================================ */
  :root {
    /* 外壳尺寸 Token 在这里登记（顶栏高 / 侧栏宽 等），不要写死在选择器里 */
  }
</style>
</head>
<body>

<!-- ============================================================
     按本系统设计稿搭建外壳：顶栏 / 侧栏 / 面包屑 / 多标签栏
     不要从其它系统复制这一段
     ============================================================ -->

<main>
  <!-- @page-title -->
  <!-- @tabs-slot -->
  <!-- @content-slot -->
</main>

</body>
</html>
